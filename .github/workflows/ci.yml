name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alef
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: alef_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alef -d alef_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: alef
      DB_PASSWORD: test-password
      DB_DATABASE: alef_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run migration:run:prod
